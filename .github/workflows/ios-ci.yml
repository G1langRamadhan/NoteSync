name: iOS CI

# Kapan workflow ini jalan?
on:
  push:
    branches: [ "main" ]      # setiap push ke main
  pull_request:
    branches: [ "main" ]      # setiap ada PR ke main

jobs:
  build-and-test:
    name: Build & Test
    runs-on: macos-15          # mesin macOS di server GitHub

    steps:
      # 1. Ambil kode kamu dari repo
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Pilih versi Xcode yang ingin dipakai
      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode_26.0.1.app

      # 3. Build & test
      - name: Build and Test
        run: |
          xcodebuild test \
            -project NoteSync.xcodeproj \
            -scheme NoteSync \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest' \
            -resultBundlePath TestResults \
            | xcpretty